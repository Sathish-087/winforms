name: Validate Windows build and full test suites

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regression-tests:
    if: github.repository == 'Sathish-087/winforms'
    name: Windows ${{ matrix.architecture }} ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
        configuration: [Debug, Release]
    defaults:
      run:
        shell: powershell
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - name: Clean build artifacts
        run: |
          & .\build.cmd -clean
          exit $LASTEXITCODE

      - name: Build Windows Forms solution
        id: build
        run: |
          & .\build.cmd `
            -msbuildEngine dotnet `
            -configuration ${{ matrix.configuration }} `
            -platform ${{ matrix.architecture }} `
            -projects Winforms.sln `
            /p:TargetArchitecture=${{ matrix.architecture }} `
            -binaryLogName full-build.binlog
          exit $LASTEXITCODE

      - name: Run all unit tests
        run: |
          & .\eng\common\build.ps1 `
            -nativeToolsOnMachine `
            -test `
            -msbuildEngine dotnet `
            -configuration ${{ matrix.configuration }} `
            -platform ${{ matrix.architecture }} `
            /p:TargetArchitecture=${{ matrix.architecture }} `
            -binaryLogName unit-tests.binlog `
            /m:1
          exit $LASTEXITCODE

      - name: Run all integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          XUNIT_LOGS: ${{ github.workspace }}\artifacts\log\${{ matrix.configuration }}
        run: |
          & .\eng\common\build.ps1 `
            -nativeToolsOnMachine `
            -integrationTest `
            -msbuildEngine dotnet `
            -configuration ${{ matrix.configuration }} `
            -platform ${{ matrix.architecture }} `
            /p:TargetArchitecture=${{ matrix.architecture }} `
            -binaryLogName integration-tests.binlog `
            /m:1
          exit $LASTEXITCODE

      - name: Upload build logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results-${{ matrix.architecture }}-${{ matrix.configuration }}
          path: |
            artifacts/log/**
            artifacts/TestResults/**
          if-no-files-found: warn
